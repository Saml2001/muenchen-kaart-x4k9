    if(!ag.has(p.a))return false; if(!cats.has(p.c||'wohnung'))return false;
    if(p.r&&p.r>max)return false; if(m2&&!(p.m2>=m2))return false; if(zi&&!(p.z>=zi))return false;
    if(furn==='yes'&&p.f!==true)return false; if(furn==='no'&&p.f===true)return false;
    if(city&&!p.ic)return false; if(exact&&!(p.p==='street'||p.p==='exact'))return false;
    if(days<99999&&!(p.days!=null&&p.days<=days))return false;
    return true;});
}
function redraw(){
  shown=filt(); cluster.clearLayers(); cluster.addLayers(shown.map(it=>it.marker));
  document.getElementById('cnt').textContent=shown.length+' von '+items.length+' Angeboten';
  renderList();
}
function renderList(){
  const s=document.getElementById('sort').value; const b=map.getBounds();
  let arr=shown.filter(it=>b.contains(it.marker.getLatLng()));
  const key={new:it=>it.p.days==null?1e9:it.p.days,price:it=>it.p.r||1e9,pricem2:it=>it.p.pm2||1e9,m2:it=>-(it.p.m2||0)}[s];
  arr.sort((x,y)=>key(x)-key(y));
  const el=document.getElementById('list'); el.innerHTML='';
  arr.slice(0,300).forEach(({p,marker})=>{
    const d=document.createElement('div'); d.className='item'; d.dataset.id=p.id;
    d.innerHTML=(p.img?`<img src="${p.img}" loading="lazy" onerror="this.outerHTML='<div class=noimg></div>'">`:'<div class="noimg"></div>')+
      `<div style="min-width:0"><div class="t">${esc(p.t||'Wohnung')}</div><div class="m"><span class="pr">${p.rc?eur(p.rc):(p.rw?eur(p.rw)+' warm':'auf Anfrage')}</span> · ${meta(p)}</div><div class="l">${esc(loc(p))} · ${esc(p.an)}${p.days!=null&&p.days<=3?' <span class="tag" style="background:#e8f6ee;color:#1e7d45">neu</span>':''}</div></div>`;
    d.onclick=()=>{map.setView(marker.getLatLng(),Math.max(map.getZoom(),16));cluster.zoomToShowLayer(marker,()=>marker.openPopup());highlight(p.id);if(window.innerWidth<=760)document.getElementById('side').classList.remove('open');};
    el.appendChild(d);
  });
  if(arr.length>300){const d=document.createElement('div');d.className='small';d.style.padding='8px 14px';d.textContent='… und '+(arr.length-300)+' weitere (Karte hineinzoomen)';el.appendChild(d);}
}
function highlight(id){document.querySelectorAll('.item').forEach(e=>e.classList.toggle('active',e.dataset.id===id));const a=document.querySelector('.item.active');if(a)a.scrollIntoView({block:'nearest'});}
document.querySelectorAll('#filters input, #filters select').forEach(e=>e.addEventListener('input',redraw));
document.getElementById('sort').addEventListener('change',renderList);
document.getElementById('allon').onclick=()=>{document.querySelectorAll('.fagent').forEach(e=>e.checked=true);redraw();};
document.getElementById('alloff').onclick=()=>{document.querySelectorAll('.fagent').forEach(e=>e.checked=false);redraw();};
document.getElementById('toggle').onclick=()=>document.getElementById('side').classList.toggle('open');
document.getElementById('ftog').onclick=e=>{const f=document.getElementById('filters');f.classList.toggle('collapsed');e.target.textContent=f.classList.contains('collapsed')?'Filter einblenden':'Filter ausblenden';};
map.on('moveend',renderList);
redraw();
</script></body></html>
